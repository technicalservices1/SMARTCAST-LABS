<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Anthony Maio">
<title>Starlink Data Consumption &mdash; SmartSource</title>
<style>
  :root{
    --bg:#0f1117; --panel:#161923; --panel2:#1c2030; --line:#262b3a;
    --txt:#e6e9f0; --mut:#8b93a7; --amber:#f59e0b; --blue:#60a5fa;
    --green:#34d399; --red:#f87171; --violet:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:18px 30px 24px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1560px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .title h1{font-size:23px;font-weight:700;letter-spacing:.2px}
  .title h1 .accent{color:var(--amber)}
  .title .sub{color:var(--mut);font-size:13px;margin-top:4px}
  .meta{text-align:right;font-size:12.5px;color:var(--mut);line-height:1.7}
  .meta b{color:var(--blue);font-weight:600}
  .meta .stamp{color:var(--amber);font-weight:600}

  .hero{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:12px}
  @media(max-width:1180px){.hero{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.hero{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
  .metric .subline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    color:var(--mut);font-size:11.5px;font-weight:600;margin:4px 0 -2px}
  .metric .subline b{font-weight:700}
  .metric .label{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .metric .val{font-size:27px;font-weight:750;margin-top:6px;letter-spacing:-.5px}
  .metric .val.amber{color:var(--amber)} .metric .val.blue{color:var(--blue)}
  .metric .val.red{color:var(--red)} .metric .val.green{color:var(--green)} .metric .val.violet{color:var(--violet)}
  .metric .val .u{font-size:14px;color:var(--mut);font-weight:600;margin-left:4px}
  .metric .foot{color:var(--mut);font-size:11.5px;margin-top:6px}
  .metric .bar{height:5px;border-radius:4px;background:var(--line);margin-top:11px;overflow:hidden}
  .metric .bar>i{display:block;height:100%}
  .card.metric.clickable{cursor:pointer;transition:border-color .15s,background .15s}
  .card.metric.clickable:hover{border-color:var(--amber);background:var(--panel2)}
  .card.metric.clickable.active-filter{border-color:var(--amber);background:rgba(245,158,11,.06)}
  .filter-note{display:flex;align-items:center;gap:10px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:9px 16px;margin-bottom:14px;font-size:12.5px;color:#f6d38a}
  .filter-note button{margin-left:auto;background:none;border:1px solid rgba(245,158,11,.4);color:#f6d38a;border-radius:6px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-weight:600}
  .filter-note button:hover{background:rgba(245,158,11,.15)}

  .addon-panel{background:var(--panel2);border:1px solid rgba(245,158,11,.28);border-radius:12px;padding:14px 18px;margin-bottom:12px}
  .ao-head{color:var(--amber);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
  .ao-head .ao-sub{display:block;color:var(--mut);font-size:11.5px;font-weight:500;text-transform:none;letter-spacing:0;margin-top:3px}
  .ao-row{display:flex;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ao-row .ao-name{flex:1;color:var(--txt);font-weight:600}
  .ao-row .ao-gb{color:var(--amber);font-weight:700;min-width:90px;text-align:right}
  .ao-row .ao-date{color:var(--mut);font-size:11.5px;min-width:88px;text-align:right}
  .ao-src{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border:1px solid var(--line);border-radius:6px}
  .ao-del{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer}
  .ao-del:hover{border-color:var(--red);color:var(--red)}
  .ao-empty{color:var(--mut);font-size:12.5px;padding:4px 0 8px}
  .ao-form{display:flex;gap:10px;align-items:center;margin-top:11px;flex-wrap:wrap}
  .ao-form input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 11px;font-size:13px;font-family:inherit}
  .ao-lab{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .ao-lab:first-child{flex:1;min-width:180px}
  .ao-form input#aoGb{width:150px}
  .ao-form button{align-self:flex-end}
  .ao-form button{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);color:var(--amber);border-radius:8px;padding:7px 18px;font-size:13px;font-weight:650;cursor:pointer;font-family:inherit}
  .ao-form button:hover{background:rgba(245,158,11,.25)}
  .ao-form .ao-total{color:var(--mut);font-size:12px;margin-left:auto}
  .sumbar{display:flex;flex-wrap:wrap;gap:26px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 22px;margin-bottom:14px}
  .sumbar .it{font-size:12.5px;color:var(--mut)}
  .sumbar .it b{color:var(--txt);font-weight:650;font-size:13.5px}
  .sumbar .it .k{color:var(--blue)}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-bottom:14px}
  .cols>.card{min-width:0;overflow:hidden}
  @media(max-width:1500px){.cols{grid-template-columns:minmax(0,1fr)}}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
  h2.sec .lbl{display:flex;align-items:center;gap:8px}
  h2.sec .cnt{color:var(--mut);font-weight:600;text-transform:none;letter-spacing:0;font-size:11.5px}
  h2.sec .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
  h2.sec .dot.blue{background:var(--blue)} h2.sec .dot.red{background:var(--red)}

  .scrollbox{max-height:390px;overflow-y:auto;overflow-x:auto;border-radius:10px}
  .scrollbox::-webkit-scrollbar{width:8px}
  .scrollbox::-webkit-scrollbar-track{background:transparent}
  .scrollbox::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .scrollbox::-webkit-scrollbar-thumb:hover{background:#333a4d}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2)}
  td.kit{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;color:var(--mut)}
  td.ecode{color:var(--mut);font-size:12px;min-width:70px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:650;white-space:nowrap}
  .pill.p50{background:rgba(96,165,250,.14);color:var(--blue)}
  td.allow{color:var(--mut)}
  td.near{color:var(--amber);font-weight:650}
  .pill.pover{background:rgba(248,113,113,.15);color:var(--red)}
  .pill.pnear{background:rgba(245,158,11,.15);color:var(--amber)}
  td.client{color:var(--txt);font-size:12px;max-width:118px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td.client.none{color:var(--mut);font-style:italic}
  .pill.pg3{background:rgba(167,139,250,.16);color:var(--violet)}
  .pill.pmini{background:rgba(52,211,153,.14);color:var(--green)}
  .over{color:var(--red);font-weight:700}
  .rank{color:var(--mut);font-weight:700;width:26px}
  .ubar{position:relative;height:20px;background:var(--line);border-radius:5px;overflow:hidden;min-width:90px}
  .ubar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--amber),#fbbf24)}
  .empty{color:var(--mut);font-size:13px;padding:20px;text-align:center}

  footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Starlink <span class="accent">Data Consumption</span></h1>
      <div class="sub">SmartSource fleet usage &mdash; per billing cycle</div>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="hero" id="hero"></div>
  <div class="addon-panel" id="addonPanel" style="display:none"></div>
  <div class="sumbar" id="sumbar"></div>
  <div class="filter-note" id="filterNote" style="display:none"></div>

  <div class="cols">
    <div class="card">
      <h2 class="sec">
        <span class="lbl"><span class="dot red"></span> Overage Watchlist &mdash; over &amp; approaching allowance</span>
        <span class="cnt" id="overCnt"></span>
      </h2>
      <div class="scrollbox" id="overWrap"></div>
    </div>
    <div class="card">
      <h2 class="sec">
        <span class="lbl"><span class="dot"></span> All Devices</span>
        <span class="cnt" id="topCnt"></span>
      </h2>
      <div class="scrollbox" id="topWrap"></div>
    </div>
  </div>

  <footer>
    <div>Starlink Data Consumption Dashboard &middot; SmartSource Rentals</div>
    <div id="foot"></div>
  </footer>
</div>

// Kit serial prefix is the model: KIT4M = Mini, KIT4P = Gen 3 Performance.
// Verified against the tracker — no serial is ever typed as the other model.
// A kit is flagged as approaching when it has used WARN_PCT of its allowance, or
// when its current burn rate projects past the allowance by the end of the cycle.
// 80% matches the warning threshold the SharePoint Data Calculator already uses.
const WARN_PCT = 80;

// Mid-cycle data purchases (e.g. a 5 TB add-on). Stored against the billing cycle
// they were bought in, so they accumulate through the month and fall away on their
// own once a new cycle starts - loadAddons returns nothing when the stored cycle
// no longer matches the current one.
const ADDON_KEY = 'ssr_starlink_addons_v1';
function loadAddons(cycle){
  try{
    const raw = localStorage.getItem(ADDON_KEY); if(!raw) return [];
    const o = JSON.parse(raw);
    if(!o || o.cycle !== cycle) return [];        // previous cycle - drops off
    return Array.isArray(o.items) ? o.items : [];
  }catch(e){ return []; }                          // private mode / storage disabled
}
function saveAddons(cycle, items){
  try{ localStorage.setItem(ADDON_KEY, JSON.stringify({cycle, items})); }catch(e){}
}

function modelOf(kit){const k=String(kit||'').toUpperCase();
  if(k.startsWith('KIT4P'))return 'Gen 3'; if(k.startsWith('KIT4M'))return 'Mini'; return 'Other';}

function cycleFraction(data){
  const s=new Date(data.billingStart+'T00:00:00'), e=new Date(data.billingEnd+'T00:00:00');
  const span=e-s; if(!(span>0)) return 1;
  const f=(Date.now()-s)/span;
  return Math.min(1, Math.max(0.02, f));   // floor keeps early-cycle projections sane
}

function compute(data){
  // Every kit pools at 50 GB, so plan is normalized to 50 GB here regardless of
  // what the source export lists in its Plan Amount column.
  // De-duplicate by kit — the source export occasionally lists the same kit twice (a real
  // usage row plus a stray 0 GB phantom row). Keep whichever row has the higher usage.
  const byKit = new Map();
  data.records.forEach(r=>{
    const existing = byKit.get(r.kit);
    if(!existing || r.usage > existing.usage) byKit.set(r.kit, r);
  });
  const recs = [...byKit.values()].map(r=>({...r, plan:'50 GB', planGB:50,
                 ecode:r.ecode||ECODE_MAP[r.kit]||'', model:modelOf(r.kit),
                 client:r.client||(orderOf(r.kit)||{}).client||clientOf(r.kit),
                 allowance:(r.allowance!=null?r.allowance
                            :((orderOf(r.kit)||{}).allowance!=null?orderOf(r.kit).allowance
                              :ALLOWANCE_MAP[r.kit]))}));
  const total = recs.reduce((s,r)=>s+r.usage,0);
  const pool = recs.reduce((s,r)=>s+(r.planGB||0),0);
  const active = recs.filter(r=>r.usage>0).length;
  // Overage is measured against each kit's contracted monthly allowance, not the
  // 50 GB pooled plan. A kit with no allowance on file cannot be judged, so it is
  // left off the watchlist rather than compared against the wrong number.
  const frac = cycleFraction(data);
  const scored = recs.filter(r=>r.allowance>0).map(r=>({
      ...r,
      overBy: r.usage-r.allowance,
      pct: r.usage/r.allowance*100,
      projected: r.usage/frac
  }));
  // Over = already past allowance. Approaching = at WARN_PCT, or on pace to finish over.
  const over = scored.filter(r=>r.usage>r.allowance).sort((a,b)=>b.overBy-a.overBy);
  const nearing = scored.filter(r=>r.usage<=r.allowance &&
                                   (r.pct>=WARN_PCT || r.projected>r.allowance))
                        .sort((a,b)=>b.pct-a.pct);
  const watch = [...over.map(r=>({...r,state:'over'})),
                 ...nearing.map(r=>({...r,state:'near'}))];
  const top = [...recs].sort((a,b)=>b.usage-a.usage);
  const models={};
  MODELS.forEach(k=>models[k]={n:0,gb:0});
  recs.forEach(r=>{(models[r.model]=models[r.model]||{n:0,gb:0}); models[r.model].n++; models[r.model].gb+=r.usage;});
  return {recs,total,pool,active,over,watch,frac,top,models};
}

let activeStatusFilter = null; // null = no filter, otherwise 'active' or 'idle'
let activeModelFilter = null;  // null = no filter, otherwise 'Gen 3' or 'Mini'

function render(data){
  const m=compute(data);
  const bs=new Date(data.billingStart+'T00:00:00'), be=new Date(data.billingEnd+'T00:00:00');
  const opt={month:'short',day:'numeric',year:'numeric'};
  const cycle=bs.toLocaleDateString(undefined,opt)+' \u2013 '+be.toLocaleDateString(undefined,opt);

  document.getElementById('meta').innerHTML =
    'Billing cycle &nbsp;<b>'+cycle+'</b><br>'+
    'Data refreshed &nbsp;<span class="stamp">'+new Date().toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span>';

  const idle=m.recs.length-m.active;
  const cycleKey = data.billingStart;
  // a purchase belongs to the cycle its date falls inside
  const committed = (FILE_ADDONS||[])
      .filter(a=>a.added>=cycleKey && a.added<data.billingEnd)
      .map((a,n)=>({...a, id:'file'+n, fromFile:true}));
  const addons = committed.length ? committed : loadAddons(cycleKey);
  const addonGB = addons.reduce((s,a)=>s+(Number(a.gb)||0),0);
  const basePool = m.pool;
  const pool = basePool + addonGB;                     // add-ons lift the pool
  const poolPct = pool>0 ? m.total/pool*100 : 0;       // true figure, can exceed 100
  const poolBar = Math.min(100, poolPct);              // bar width only - caps at full
  const poolCol = poolPct>100 ? 'var(--red)' : 'var(--green)';

  document.getElementById('hero').innerHTML = [
    heroCard('Total Data Consumed', (m.total/1000).toFixed(2), 'TB', 'amber', fmt(m.total,0)+' GB this cycle'),
    heroCard('Data Pool', (pool/1000).toFixed(2), 'TB', 'green',
      (addonGB>0
        ? fmt(basePool,0)+' + <span style="color:var(--amber);font-weight:700">'+fmt(addonGB,0)+' add-on</span>'
        : fmt(basePool,0)+' GB allotted')
      +' &middot; <span style="color:'+poolCol+';font-weight:700">'+poolPct.toFixed(0)+'% used</span>',
      poolBar, poolCol, {clickable:true, addon:true, active:addonPanelOpen,
        subline:'<span>Total</span><span>Remaining <b style="color:'+(pool-m.total>=0?'var(--green)':'var(--red)')+'">'
                +tb(Math.abs(pool-m.total))+(pool-m.total<0?' over':'')+'</b></span>'}),
    heroCard('Active Kits', fmt(m.active), '', 'blue', 'of '+m.recs.length+' provisioned', null, null, {clickable:true, statusName:'active', active:activeStatusFilter==='active'}),
    heroCard('Idle Kits', fmt(idle), '', 'green', '0 GB used this cycle', null, null, {clickable:true, statusName:'idle', active:activeStatusFilter==='idle'}),
    heroCard('Gen 3 Performance', fmt(m.models['Gen 3'].n), 'kits', 'violet', fmt(m.models['Gen 3'].gb,0)+' GB this cycle', null, null, {clickable:true, modelName:'Gen 3', active:activeModelFilter==='Gen 3'}),
    heroCard('Mini', fmt(m.models['Mini'].n), 'kits', 'blue', fmt(m.models['Mini'].gb,0)+' GB this cycle', null, null, {clickable:true, modelName:'Mini', active:activeModelFilter==='Mini'})
  ].join('');

  // wire up click handlers on the tiles just rendered
  document.querySelectorAll('#hero .card.clickable').forEach(el=>{
    el.addEventListener('click', ()=>{
      const status = el.getAttribute('data-status');
      const model = el.getAttribute('data-model');
      if(el.getAttribute('data-addon')){ addonPanelOpen=!addonPanelOpen; render(data); return; }
      if(status!=null){ activeStatusFilter = (activeStatusFilter===status) ? null : status; }
      if(model!=null){ activeModelFilter = (activeModelFilter===model) ? null : model; }
      render(data);
    });
  });

  // add-on entry panel
  const ap = document.getElementById('addonPanel');
  if(addonPanelOpen){
    ap.style.display='block';
    const rows = addons.length
      ? addons.map(a=>`<div class="ao-row"><span class="ao-name">${a.label}</span>
           <span class="ao-gb">${fmt(a.gb,0)} GB</span>
           <span class="ao-date">${a.added||''}</span>
           ${a.fromFile?'<span class="ao-src">from file</span>'
                       :`<button class="ao-del" data-id="${a.id}">Remove</button>`}</div>`).join('')
      : '<div class="ao-empty">No add-ons recorded for this billing cycle.</div>';
    ap.innerHTML = `
      <div class="ao-head">Data pool add-ons &mdash; ${cycleKey} cycle
        <span class="ao-sub">${committed.length
          ? 'Read from Starlink_Pool_AddOns.xlsx'
          : 'Entered on this machine only &mdash; add a row to Starlink_Pool_AddOns.xlsx to make it visible to everyone. Applies to this cycle and clears when the next one starts.'}</span></div>
      ${rows}
      <div class="ao-form">
        <label class="ao-lab">Description
          <input id="aoLabel" type="text" autocomplete="off" value="5 TB add on"></label>
        <label class="ao-lab">Amount (GB)
          <input id="aoGb" type="number" autocomplete="off" value="5000" min="1" step="any"></label>
        <button id="aoAdd">Add</button>
        <span class="ao-total" id="aoMsg">${addonGB>0?'Total added: '+fmt(addonGB,0)+' GB':''}</span>
      </div>`;
    const commit = ()=>{
      const lbl=(document.getElementById('aoLabel').value||'').trim()||'Add-on';
      const gb=parseFloat(document.getElementById('aoGb').value);
      const msg=document.getElementById('aoMsg');
      if(!isFinite(gb)||gb<=0){
        msg.textContent='Enter a GB amount greater than zero.';
        msg.style.color='var(--red)'; return;
      }
      const items=[...addons,{id:String(Date.now()),label:lbl,gb:gb,
                              added:new Date().toISOString().slice(0,10)}];
      saveAddons(cycleKey,items); render(data);
    };
    document.getElementById('aoAdd').addEventListener('click',commit);
    ap.querySelectorAll('.ao-form input').forEach(i=>{
      i.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); });
      i.addEventListener('focus',()=>i.select());
    });
    ap.querySelectorAll('.ao-del').forEach(btn=>btn.addEventListener('click',()=>{
      saveAddons(cycleKey, addons.filter(a=>a.id!==btn.getAttribute('data-id')));
      render(data);
    }));
  } else { ap.style.display='none'; ap.innerHTML=''; }

  document.getElementById('sumbar').innerHTML =
    sb('Kits total',m.recs.length)+
    sb('Data pool', tb(pool))+
    sb('Avg / active kit', m.active? tb(m.total/m.active):'\u2014')+
    sb('Peak kit', tb(m.top[0]?m.top[0].usage:0));

  // filter note banner — combines status + model filters when both are active
  const fn = document.getElementById('filterNote');
  if(activeStatusFilter || activeModelFilter){
    const parts = [];
    if(activeStatusFilter) parts.push(activeStatusFilter==='active' ? 'Active' : 'Idle');
    if(activeModelFilter) parts.push(activeModelFilter);
    fn.style.display='flex';
    fn.innerHTML = `<span>Showing only <b>${parts.join(' \u00b7 ')}</b> kits</span><button id="clearFilterBtn">Clear filter</button>`;
    document.getElementById('clearFilterBtn').addEventListener('click', ()=>{ activeStatusFilter=null; activeModelFilter=null; render(data); });
  } else {
    fn.style.display='none';
    fn.innerHTML='';
  }

  const matchesFilters = r =>
    (!activeStatusFilter || (activeStatusFilter==='active' ? r.usage>0 : r.usage===0)) &&
    (!activeModelFilter || r.model===activeModelFilter);

  const overFiltered = m.watch.filter(matchesFilters);
  const topFiltered = m.top.filter(matchesFilters);

  const nOver = overFiltered.filter(r=>r.state==='over').length;
  document.getElementById('overCnt').textContent =
    nOver+' over \u00b7 '+(overFiltered.length-nOver)+' approaching';
  const ow=document.getElementById('overWrap');
  if(!overFiltered.length){ ow.innerHTML='<div class="empty">No kits over or approaching their allowance'+((activeStatusFilter||activeModelFilter)?' match this filter':'')+' this cycle.</div>'; }
  else{
    let rows=overFiltered.map(r=>`<tr>
      <td class="kit">${r.kit}</td>
      <td class="ecode">${r.ecode||''}</td>
      <td class="client${r.client?'':' none'}">${r.client||'Unassigned'}</td>
      <td><span class="pill ${r.model==='Gen 3'?'pg3':'pmini'}">${r.model}</span></td>
      <td class="num allow">${r.allowance!=null?fmt(r.allowance,0):'\u2014'}</td>
      <td class="num">${fmt(r.usage,1)}</td>
      <td class="num ${r.state==='over'?'over':'near'}">${r.pct.toFixed(0)}%</td>
      <td><span class="pill ${r.state==='over'?'pover':'pnear'}">${r.state==='over'?'Over +'+fmt(r.overBy,1):'Approaching'}</span></td></tr>`).join('');
    ow.innerHTML=`<table><thead><tr><th>Kit</th><th>ECODE</th><th>Client</th><th>Type</th><th>Allowance</th><th>Used</th><th>% Used</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  document.getElementById('topCnt').textContent = topFiltered.length+' kits';
  const max=topFiltered[0]?topFiltered[0].usage:1;
  let trows=topFiltered.map((r,i)=>`<tr>
    <td class="rank">${i+1}</td>
    <td class="kit">${r.kit}</td>
    <td class="ecode">${r.ecode||''}</td>
    <td class="client${r.client?'':' none'}">${r.client||'Unassigned'}</td>
    <td><span class="pill ${r.model==='Gen 3'?'pg3':'pmini'}">${r.model}</span></td>
    <td><span class="pill p50">${r.plan}</span></td>
    <td style="width:16%"><div class="ubar"><i style="width:${Math.max(4,r.usage/max*100)}%"></i></div></td>
    <td class="num">${fmt(r.usage,1)}</td></tr>`).join('');
  document.getElementById('topWrap').innerHTML=`<table><thead><tr><th>#</th><th>Kit</th><th>ECODE</th><th>Client</th><th>Type</th><th>Plan</th><th>Usage</th><th>GB</th></tr></thead><tbody>${trows}</tbody></table>`;

  document.getElementById('foot').innerHTML='Total '+tb(m.total)+' of '+tb(pool)+' pool &middot; '+m.recs.length+' kits';
}
function heroCard(label,val,unit,cls,foot,pct,col,opts){
  const barHtml = (pct!=null) ? `<div class="bar"><i style="width:${pct}%;background:${col}"></i></div>` : '';
  const o = opts||{};
  const extraClass = o.clickable ? ' clickable'+(o.active?' active-filter':'') : '';
  let dataAttr = '';
  if(o.clickable && o.statusName!=null) dataAttr += ` data-status="${o.statusName}"`;
  if(o.clickable && o.modelName!=null) dataAttr += ` data-model="${o.modelName}"`;
  if(o.clickable && o.addon) dataAttr += ` data-addon="1"`;
  const subHtml = o.subline ? `<div class="subline">${o.subline}</div>` : '';
  return `<div class="card metric${extraClass}"${dataAttr}><div class="label">${label}</div>${subHtml}<div class="val ${cls}">${val}${unit?'<span class="u">'+unit+'</span>':''}</div><div class="foot">${foot}</div>${barHtml}</div>`;
}
function sb(k,v){return `<div class="it">${k} <b>${v}</b></div>`;}

// Ask GitHub when a specific file path was last actually pushed (real commit timestamp,
// not anything parsed from the filename). Works correctly no matter how many times a day
// a new file gets uploaded, and regardless of naming convention.
async function lastCommitTime(owner,repo,branch,filePath){
  const api = `https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(filePath)}&sha=${branch}&per_page=1`;
  const commits = await (await fetch(api,{cache:'no-store'})).json();
  if(!Array.isArray(commits) || !commits.length) return -Infinity;
  const dateStr = commits[0]?.commit?.committer?.date || commits[0]?.commit?.author?.date;
  return dateStr ? new Date(dateStr).getTime() : -Infinity;
}

async function discoverLatestFile(cfg){
  const {owner,repo,path,branch,fileMatch} = cfg;
  const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
  const listing = await (await fetch(api,{cache:'no-store'})).json();
  if(!Array.isArray(listing)) throw new Error('GitHub API did not return a directory listing');
  const candidates = listing.filter(f=>f.type==='file' && fileMatch.test(f.name));
  if(!candidates.length) throw new Error('No files in repo matched fileMatch pattern');
  if(candidates.length===1) return candidates[0];
  // multiple matches — ask GitHub which one was actually pushed most recently
  const withTimes = await Promise.all(candidates.map(async f=>({
    file:f, t: await lastCommitTime(owner,repo,branch,f.path||f.name)
  })));
  withTimes.sort((a,b)=>b.t-a.t);
  return withTimes[0].file;
}

// Reads the Orders tab into {kit: {client, allowance}}.
function parseOrders(buf, sheetName){
  const wb = XLSX.read(buf,{type:'array'});
  const ws = wb.Sheets[sheetName] || wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
  const hdr = (aoa[0]||[]).map(x=>String(x).trim().toLowerCase());
  const iKit=hdr.indexOf('kit'), iCli=hdr.indexOf('client'), iAll=hdr.indexOf('monthly allowance');
  if(iKit<0) throw new Error('Orders tab has no Kit column');
  const out={};
  for(const r of aoa.slice(1)){
    const kit=String(r[iKit]||'').trim();
    if(!/^KIT4[MP]/i.test(kit)) continue;
    const cli = iCli>=0 ? String(r[iCli]||'').trim() : '';
    const al  = iAll>=0 ? parseFloat(r[iAll]) : NaN;
    out[kit]={ client: cli?cli.toUpperCase():'', allowance: isFinite(al)?al:null };
  }
  return out;
}

// Live Orders data wins; the baked-in snapshots are the fallback.
let LIVE_ORDERS = null;
function orderOf(kit){ return (LIVE_ORDERS && LIVE_ORDERS[kit]) || null; }

// Reads the AddOns tab into [{label,gb,added}]. 'added' is the purchase date, which is
// what places each row in a billing cycle at render time.
function parseAddonFile(buf, sheetName){
  const wb = XLSX.read(buf,{type:'array',cellDates:true});
  const ws = wb.Sheets[sheetName] || wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
  const hdr = (aoa[0]||[]).map(x=>String(x).trim().toLowerCase());
  const iDesc=hdr.indexOf('description'), iGb=hdr.indexOf('gb'), iBought=hdr.indexOf('purchased on');
  if(iGb<0||iBought<0) throw new Error('AddOns tab needs GB and Purchased On columns');
  const dstr=v=>{ if(v==null||v==='') return null;
    if(v instanceof Date) return v.toISOString().slice(0,10);
    if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10);}
    const d=new Date(v); return isNaN(d)?String(v).trim():d.toISOString().slice(0,10); };
  const out=[];
  for(const r of aoa.slice(1)){
    const gb=parseFloat(r[iGb]); const bought=dstr(r[iBought]);
    if(!isFinite(gb)||gb<=0||!bought) continue;       // blank row, or undateable so unplaceable
    out.push({ gb:gb, added:bought,
               label:(iDesc>=0?String(r[iDesc]||'').trim():'')||'Add-on' });
  }
  return out;
}

// Committed add-ons for the current cycle replace anything entered locally, so the same
// purchase typed here and committed to the file is never counted twice.
let FILE_ADDONS = null;

async function fetchAddons(){
  try{
    const f = await discoverLatestFile(ADDON_DIR_AUTO);
    const buf = await (await fetch(f.download_url,{cache:'no-store'})).arrayBuffer();
    FILE_ADDONS = parseAddonFile(buf, ADDON_DIR_AUTO.sheet);
    console.log('Loaded add-ons from', f.name, '-', FILE_ADDONS.length, 'rows');
  }catch(e){ console.warn('Add-on file not loaded, using local entries only:', e); }
}

async function fetchOrders(){
  try{
    const f = await discoverLatestFile(CLIENT_DIR_AUTO);
    const buf = await (await fetch(f.download_url,{cache:'no-store'})).arrayBuffer();
    const map = parseOrders(buf, CLIENT_DIR_AUTO.sheet);
    if(Object.keys(map).length){ LIVE_ORDERS = map;
      console.log('Loaded Orders from', f.name, '-', Object.keys(map).length, 'kits'); }
  }catch(e){ console.warn('Orders load failed, using embedded client/allowance:', e); }
}

async function boot(){
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  }catch(e){ console.warn('SheetJS failed to load:', e); }

  // Orders first, so client/allowance are in place before the first render.
  await Promise.all([fetchOrders(), fetchAddons()]);

  try{
    let url = DATA_URL;
    if(!url){
      const latest = await discoverLatestFile(DATA_DIR_AUTO);
      url = latest.download_url;
      console.log('Auto-discovered latest usage file:', latest.name);
    }
    if(url.toLowerCase().endsWith('.xlsx')){
      const buf=await (await fetch(url,{cache:'no-store'})).arrayBuffer();
      render(parseXlsx(buf));
    }else{
      const txt=await (await fetch(url,{cache:'no-store'})).text();
      render(parseCsv(txt));
    }
  }catch(e){ console.error('Usage load failed, using embedded snapshot:',e); render(EMBEDDED); }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function rowsToPayload(header,rows){
  const idx=n=>header.findIndex(h=>String(h).trim().toLowerCase()===n);
  const iKit=idx('kit'),iUse=idx('data usage (gb)'),iEcode=idx('ecode'),iClient=idx('client'),iAllow=idx('monthly allowance');
  const recs=[];
  for(const r of rows){
    const co=String(r[0]||'').trim(); if(co==='Total'||co.startsWith('Applied filters')||!r[iKit])continue;
    recs.push({kit:r[iKit],ecode:(iEcode>=0?String(r[iEcode]||'').trim():''),
               client:(iClient>=0?String(r[iClient]||'').trim().toUpperCase():''),
               allowance:(iAllow>=0&&r[iAllow]!==''&&r[iAllow]!=null?parseFloat(r[iAllow]):null),
               plan:'50 GB',planGB:50,usage:parseFloat(r[iUse])||0});
  }
  const iBS=idx('billing start'), iBE=idx('billing end');
  const dstr=v=>{ if(v==null||v==='')return null;
    if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10);}
    const d=new Date(v); return isNaN(d)?null:d.toISOString().slice(0,10); };
  let bStart=null,bEnd=null;
  for(const r of rows){ const a=iBS>=0?dstr(r[iBS]):null, b=iBE>=0?dstr(r[iBE]):null;
    if(a&&(!bStart||a>bStart)){bStart=a;bEnd=b;} }
  return {billingStart:bStart||EMBEDDED.billingStart, billingEnd:bEnd||EMBEDDED.billingEnd, records:recs};
}
function parseXlsx(buf){const wb=XLSX.read(buf,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});return rowsToPayload(aoa[0],aoa.slice(1));}
function parseCsv(txt){const lines=txt.split(/\r?\n/).filter(l=>l.length);const split=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c);c='';}else c+=ch;}o.push(c);return o;};return rowsToPayload(split(lines[0]),lines.slice(1).map(split));}

boot();
